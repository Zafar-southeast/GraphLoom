[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphloom"
version = "0.1.0"
description = "GraphLoom: Multimodal KG-RAG Framework for Grounded Question Answering"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "GraphLoom Team"}
]
keywords = ["rag", "knowledge-graph", "multimodal", "question-answering", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.21.0",
    "pillow>=9.0.0",
    "requests>=2.25.0",
    "networkx>=2.6.0",
    "tqdm>=4.62.0",
    "openai>=1.0.0",
    "groq>=0.4.0",
    "huggingface-hub>=0.20.0",
    "transformers>=4.40.0",
    "sentence-transformers>=2.2.0",
    "spacy>=3.0.0",
]

[project.optional-dependencies]
full = [
    "torch>=2.0.0",
]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
]

[project.urls]
Homepage = "https://github.com/graphloom/graphloom"
Documentation = "https://github.com/graphloom/graphloom#readme"
Repository = "https://github.com/graphloom/graphloom"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
graphloom = ["*.json"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100
